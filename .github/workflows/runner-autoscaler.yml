name: runner-autoscaler

on:
  push:
    branches: [main]
    paths:
      - "runner-autoscaler/**"
      - ".github/workflows/runner-autoscaler.yml"
  pull_request:
    paths:
      - "runner-autoscaler/**"
      - ".github/workflows/runner-autoscaler.yml"

jobs:
  build:
    name: Lint, Typecheck, Build
    runs-on: [self-hosted, Linux, X64]
    defaults:
      run:
        working-directory: runner-autoscaler
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: runner-autoscaler/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
